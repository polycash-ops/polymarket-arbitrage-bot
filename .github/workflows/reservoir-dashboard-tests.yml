name: Reservoir dashboard consumer tests

on:
  pull_request:
    paths:
      - "dashboard.py"
      - "tests/test_reservoir_dashboard_telemetry.py"
      - ".github/workflows/reservoir-dashboard-tests.yml"
  push:
    branches:
      - "fix/biological-reservoir-dashboard-telemetry-20261017"
    paths:
      - "dashboard.py"
      - "tests/test_reservoir_dashboard_telemetry.py"
      - ".github/workflows/reservoir-dashboard-tests.yml"

jobs:
  consumer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_reservoir_dashboard_telemetry.py" -v
