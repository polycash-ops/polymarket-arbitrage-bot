name: Reservoir dashboard consumer tests

on:
  pull_request:
    paths:
      - "dashboard.py"
      - "reservoir_consumer.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/reservoir-dashboard-tests.yml"
  push:
    branches:
      - "fix/biological-reservoir-dashboard-telemetry-20261017"
      - "fix/contract-alert-strict-issuance-20261017"
    paths:
      - "dashboard.py"
      - "reservoir_consumer.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/reservoir-dashboard-tests.yml"

jobs:
  consumer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run pytest suite
        run: python -m pytest -q tests
      - name: Run dashboard frontend contract guard
        run: node tests/test_dashboard_frontend_contract_guard.js
