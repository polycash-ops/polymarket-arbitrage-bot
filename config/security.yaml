# Security Configuration for trading-bot
# Auto-generated by Ulf Security Template

secrets:
  provider: gcp_secret_manager
  gcp_project: "your-gcp-project"
  required:
    - ANTHROPIC_API_KEY
  optional:
    - COINBASE_API_KEY
    - BINANCE_API_KEY
    - POLYMARKET_API_KEY
    - DISCORD_BOT_TOKEN

iam:
  recommended_roles:
    - roles/secretmanager.secretAccessor
    - roles/logging.logWriter
    - roles/monitoring.metricWriter
  dangerous_roles:
    - roles/owner
    - roles/editor
    - roles/iam.securityAdmin

runtime:
  validate_on_startup: true
  cache_ttl: 3600
  audit_access: true

git:
  pre_commit_hook: true
  blocked_patterns:
    - "AKIA[0-9A-Z]{16}"
    - "AIza[A-Za-z0-9_-]{35}"
    - "sk-[A-Za-z0-9]{20,}"
    - "ghp_[A-Za-z0-9]{36}"
    - "-----BEGIN.*PRIVATE KEY-----"

monitoring:
  alerts:
    - billing_anomaly
    - secret_access_failure
    - unauthorized_api_call
