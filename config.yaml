# AI-Enhanced Polymarket Arbitrage Bot Configuration
# Based on 0x8dxd's proven strategy with AI enhancements

# Market monitoring settings
market_monitor:
  exchanges:
    - binance
    - coinbase 
    - kraken
  update_interval: 0.05  # 50ms - ultra low latency
  reconnect_delay: 5     # seconds
  max_reconnect_attempts: 10
  
# Opportunity detection parameters
opportunity_detection:
  min_price_difference: 0.3    # 0.3% minimum price difference
  min_confidence: 0.70         # 70% minimum confidence
  max_delay_seconds: 15        # 15s max Polymarket delay
  trend_analysis_window: 30    # 30 seconds for trend analysis
  volatility_threshold: 2.0    # 2% volatility threshold
  cross_exchange_consensus: 2  # Require 2+ exchanges to confirm
  
# Trade execution settings
trade_execution:
  max_position_size: 5000      # $5K max per trade (like 0x8dxd)
  min_position_size: 100       # $100 min per trade
  risk_per_trade: 0.02         # 2% of balance max risk
  max_daily_trades: 100        # 100 trades/day max (0x8dxd did 7300/month)
  execution_timeout: 10        # 10s max execution time
  slippage_tolerance: 0.1      # 0.1% slippage tolerance
  
# AI analysis configuration  
ai_analysis:
  ai_buffer_size: 200          # Keep 200 price points for analysis
  ai_analysis_interval: 15     # Analyze every 15 seconds
  claude_model: "claude-3-sonnet-20240229"
  sentiment_weight: 0.3        # 30% weight for sentiment
  pattern_weight: 0.4          # 40% weight for patterns
  momentum_weight: 0.3         # 30% weight for momentum
  
# Self-improvement system
self_improvement:
  improvement_analysis_interval: 1800  # 30 minutes
  min_trades_for_analysis: 10          # Min trades before analysis
  improvement_threshold: 0.03          # 3% improvement needed
  parameter_adjustment_rate: 0.1       # 10% max parameter changes
  rollback_on_degradation: true       # Auto-rollback if performance degrades
  
# Risk management
risk_management:
  max_drawdown: 0.15           # 15% max drawdown
  daily_loss_limit: 0.05       # 5% daily loss limit
  position_correlation_limit: 0.7  # Max 70% correlation between positions
  emergency_stop_loss: 0.20    # 20% emergency stop
  
# Performance targets (based on 0x8dxd)
performance_targets:
  target_win_rate: 0.90        # 90% win rate (0x8dxd had 99%)
  target_daily_return: 0.02    # 2% daily return
  target_monthly_return: 0.50  # 50% monthly return
  max_acceptable_drawdown: 0.10 # 10% max drawdown
  
# Polymarket specific settings
polymarket:
  api_url: "https://gamma-api.polymarket.com"
  websocket_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  market_refresh_interval: 2   # 2 seconds
  focus_markets:
    - "bitcoin"
    - "btc" 
    - "crypto"
  timeframes:
    - "15min"   # Primary focus like 0x8dxd
    - "1hour"   # Secondary
    
# Exchange API settings
exchanges:
  binance:
    websocket_url: "wss://stream.binance.com:9443/ws"
    api_url: "https://api.binance.com"
    symbols: ["BTCUSDT"]
    
  coinbase:
    websocket_url: "wss://ws-feed.pro.coinbase.com"
    api_url: "https://api.pro.coinbase.com" 
    symbols: ["BTC-USD"]
    
  kraken:
    websocket_url: "wss://ws.kraken.com"
    api_url: "https://api.kraken.com"
    symbols: ["XBT/USD"]
    
# Logging configuration
logging:
  level: INFO
  log_trades: true
  log_opportunities: true
  log_ai_analysis: true
  log_improvements: true
  max_log_size: "100MB"
  backup_count: 5
  
# Monitoring and alerts
monitoring:
  status_interval: 300         # 5 minutes
  performance_alert_threshold: -0.02  # Alert if daily return < -2%
  connection_alert_timeout: 30 # Alert if disconnected > 30s
  
# Development settings
development:
  paper_trading_balance: 10000  # $10K starting balance
  simulation_mode: false       # True for backtesting
  debug_mode: false           # Extra logging
  api_rate_limiting: true     # Respect API limits