# Configuration matching the keys consumed by main.py and bot components.
# Paper-only: live order execution is hard-blocked in code.
market_monitor:
  exchanges: [binance, coinbase, kraken]
  update_interval: 0.1

opportunity_detection:
  min_price_difference: 0.03
  min_confidence: 0.7
  max_delay_seconds: 15
  min_probability_lag: 0.01
  max_probability_followthrough: 0.01
  min_consensus_exchanges: 2

trade_execution:
  max_position_size: 100
  min_position_size: 5
  risk_per_trade: 0.02
  max_daily_trades: 50
  min_confidence: 0.7

connectomes:
  decision:
    max_nodes: 1000000
    max_edges: 1000000
    min_samples_for_gate: 20
    min_learned_probability: 0.50
    learning_rate: 0.03
  research:
    max_nodes: 1000000
    max_edges: 1000000
    min_samples_for_gate: 20
    learning_rate: 0.03
